<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" fill="none" role="img" aria-labelledby="readmeHeroTitle readmeHeroDesc">
  <title id="readmeHeroTitle">AURELLE - editorial fashion storefront</title>
  <desc id="readmeHeroDesc">An animated burgundy and champagne banner for the AURELLE Next.js fashion concept.</desc>

  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1600" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#120a0d"/>
      <stop offset="0.48" stop-color="#2a0f18"/>
      <stop offset="1" stop-color="#5a1523"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="0" cy="0" r="1" gradientTransform="translate(1290 120) rotate(128) scale(520 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d4552d" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d4552d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wineGlow" cx="0" cy="0" r="1" gradientTransform="translate(250 470) rotate(-38) scale(480 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9d2941" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#9d2941" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordFill" x1="240" y1="0" x2="1360" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8b79a"/>
      <stop offset="0.36" stop-color="#fbf4e9"/>
      <stop offset="0.64" stop-color="#f0d9c4"/>
      <stop offset="1" stop-color="#c89474"/>
      <animate attributeName="x1" values="120;420;120" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1180;1480;1180" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="goldRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8cdb6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f5e5d2"/>
      <stop offset="1" stop-color="#e8cdb6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="180" height="180" patternUnits="userSpaceOnUse">
      <filter id="grainNoise">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="180" height="180" filter="url(#grainNoise)" opacity="0.16"/>
    </pattern>
    <clipPath id="frameClip">
      <rect width="1600" height="560" rx="30"/>
    </clipPath>
    <clipPath id="marqueeClip">
      <rect x="60" y="492" width="1480" height="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1600" height="560" fill="url(#heroBg)"/>
    <rect width="1600" height="560" fill="url(#emberGlow)"/>
    <rect width="1600" height="560" fill="url(#wineGlow)"/>
    <rect width="1600" height="560" fill="url(#grain)" opacity="0.22"/>

    <g opacity="0.42">
      <circle cx="225" cy="250" r="196" stroke="#e7cbb4" stroke-opacity="0.34" stroke-dasharray="2 12">
        <animateTransform attributeName="transform" type="rotate" from="0 225 250" to="360 225 250" dur="52s" repeatCount="indefinite"/>
      </circle>
      <circle cx="225" cy="250" r="142" stroke="#d4552d" stroke-opacity="0.46">
        <animate attributeName="r" values="142;150;142" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.46;0.16;0.46" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="225" cy="250" r="72" fill="none" stroke="#f1dcc8" stroke-opacity="0.4"/>
    </g>

    <g opacity="0.5">
      <circle cx="1372" cy="300" r="214" stroke="#f0d8c2" stroke-opacity="0.24" stroke-dasharray="3 14">
        <animateTransform attributeName="transform" type="rotate" from="360 1372 300" to="0 1372 300" dur="64s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1372" cy="300" r="122" stroke="#d4552d" stroke-opacity="0.5">
        <animate attributeName="r" values="122;132;122" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="8s" repeatCount="indefinite"/>
      <text x="86" y="92" fill="#f0ddc9" fill-opacity="0.72" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" letter-spacing="4.6">AURELLE / ATELIER</text>
      <text x="1514" y="92" fill="#f0ddc9" fill-opacity="0.72" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" letter-spacing="3.4" text-anchor="end">SS/26</text>

      <text x="800" y="172" fill="#f1ddc9" fill-opacity="0.68" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" letter-spacing="7.5" text-anchor="middle">EDITORIAL FASHION / SUMMER 2026</text>

      <text x="800" y="304" fill="url(#wordFill)" font-family="Georgia, 'Times New Roman', serif" font-size="164" letter-spacing="22" text-anchor="middle">AURELLE</text>

      <rect x="470" y="334" width="660" height="1.4" fill="url(#goldRule)">
        <animate attributeName="opacity" values="0.32;1;0.32" dur="4.5s" repeatCount="indefinite"/>
      </rect>

      <text x="800" y="382" fill="#f6ecdf" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28" letter-spacing="2.2" text-anchor="middle">Own your summer.</text>

      <text x="800" y="426" fill="#f0ddc9" fill-opacity="0.66" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" letter-spacing="4.1" text-anchor="middle">DRESSES / SWIM / BEACHWEAR / LINGERIE / AFTER DARK</text>

      <g fill="#f0ddc9" fill-opacity="0.52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" letter-spacing="2.4">
        <text x="86" y="466">NEXT.JS 16 / THREE.JS TIMER</text>
        <text x="1514" y="466" text-anchor="end">PARIS 48.8591 N / 2.3801 E</text>
      </g>
    </g>

    <g clip-path="url(#marqueeClip)" opacity="0.78">
      <g>
        <text x="60" y="511" fill="#f0ddc9" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" letter-spacing="5.2" textLength="1480" lengthAdjust="spacing">SWIMWEAR · BIKINIS · DRESSES · BEACHWEAR · LINGERIE · NIGHT AND PARTY · SWIMWEAR · BIKINIS · DRESSES · BEACHWEAR · LINGERIE · NIGHT AND PARTY</text>
        <text x="1660" y="511" fill="#f0ddc9" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" letter-spacing="5.2" textLength="1480" lengthAdjust="spacing">SWIMWEAR · BIKINIS · DRESSES · BEACHWEAR · LINGERIE · NIGHT AND PARTY · SWIMWEAR · BIKINIS · DRESSES · BEACHWEAR · LINGERIE · NIGHT AND PARTY</text>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1600 0" dur="34s" repeatCount="indefinite"/>
      </g>
    </g>

    <rect x="0.75" y="0.75" width="1598.5" height="558.5" rx="29.25" stroke="#f2dfcc" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>
</svg>
